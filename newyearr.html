<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy New Year 🎆</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
.sticker {
  width: 120px;
  
  animation: bounce 2s infinite;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #1a0033, #000);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  cursor: crosshair;
}

/* Canvas */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Card */
.card {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 420px;
  padding: 40px 30px;
  text-align: center;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

.card h1 {
  font-size: 2.5rem;
  background: linear-gradient(45deg, #ffd700, #ff7b00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.year {
  font-size: 3.5rem;
  font-weight: bold;
}
.year-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 10px 0 20px;
}

/* Sticker same size as 2025 */
.year-sticker {
  height: 4rem;   /* SAME as .year font-size */
  width: auto;
}

button {
  margin-top: 20px;
  padding: 14px 30px;
  font-size: 1rem;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg, #ff9800, #ff3d00);
  color: #fff;
}

/* Hint text */
.hint {
  position: fixed;
  bottom: 30px;
  width: 100%;
  text-align: center;
  font-size: 1rem;
  opacity: 0.85;
  z-index: 3;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* Final text */
.final-text {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: bold;
  z-index: 3;
  animation: glowZoom 2s ease forwards;
}

@keyframes glowZoom {
  from {
    transform: scale(0.2);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
    text-shadow:
      0 0 20px pink,
      0 0 40px hotpink,
      0 0 80px red;
  }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="card" id="card">
   <h1>Happy New Year</h1>

<div class="year-wrap">
  <div class="year" id="year"></div>
  <img src="sticker.gif" alt="New Year Sticker" class="sticker year-sticker">
</div>

  <p>May this year bring joy, success, happiness and ME to you 🤪✨</p>
  <button onclick="greets()">For You 😉</button>
</div>

<div class="final-text" id="finalText">
  <h6> Happy New Year Cuties 😎💖</h6>
</div>

<div class="hint">
  💥 Click anywhere to burst a firecracker!
</div>

<script>
// Set year
document.getElementById("year").textContent = new Date().getFullYear();

// Celebrate button
function greets() {
  document.getElementById("card").style.display = "none";
  document.getElementById("finalText").style.display = "flex";
}

// Canvas
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let particles = [];

// ❤️ Heart-shaped burst
function heartBurst(x, y) {
  const color = `hsl(${Math.random()*360},100%,65%)`;

  for (let t = 0; t < Math.PI * 2; t += 0.08) {
    const r = 16 * Math.pow(Math.sin(t), 3);
    const h =
      13 * Math.cos(t) -
      5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) -
      Math.cos(4 * t);

    particles.push({
      x,
      y,
      vx: r * 0.4,
      vy: -h * 0.4,
      life: 1,
      color
    });
  }
}

// Auto fireworks
setInterval(() => {
  heartBurst(
    Math.random() * canvas.width,
    Math.random() * canvas.height * 0.6
  );
}, 900);

// Click fireworks
canvas.addEventListener("click", e => {
  heartBurst(e.clientX, e.clientY);
});

// Touch fireworks
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  heartBurst(t.clientX, t.clientY);
});

// Animation
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.015;

    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = p.color;
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();

    if (p.life <= 0) particles.splice(i,1);
  });

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
